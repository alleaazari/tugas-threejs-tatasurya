<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tugas Mandiri - Tata Surya</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #050508; font-family: Arial, sans-serif; }
canvas { display: block; }

/* PERBAIKAN: Posisi info dipindah ke Kanan Atas (right: 16px) */
#info { position: fixed; top: 16px; right: 16px; width: 320px;
color: #fff; background: rgba(5, 5, 10, 0.75);
padding: 14px 18px; border-radius: 8px; border: 1px solid #333;
font-size: 14px; pointer-events: none; line-height: 1.6; }

#vrBtn { position: fixed; bottom: 24px;
left: 50%; transform: translateX(-50%);
padding: 12px 28px; border: none;
background: #F5A623; color: #1C1F26;
font-weight: bold; border-radius: 8px;
cursor: pointer; z-index: 100; }
</style></head><body>
<div id="info">
    <h2>🌌 Mini Tata Surya</h2>
    <p style="color: #aaa; margin-top: 4px;">Arahkan mouse untuk HOVER | Klik objek untuk DETAIL</p>
</div>
<button id="vrBtn">Masuk VR</button>
<canvas id="c"></canvas>
<script type="module" src="app.js"></script>
</body></html>
